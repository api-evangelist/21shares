gaps:
- >-
  The FinDatEx family is distributed as XLSX files at fixed CDN URLs with no versioned index, no
  changelog, no checksum and no machine-readable pointer (no /apis.json, no /.well-known/api-catalog),
  so a consumer has to poll Last-Modified to notice a change.
- >-
  No CSV or JSON serialization of the EMT/EPT/EET is offered alongside the spreadsheets, and the
  per-product NAV, holdings and cost data on the website is not published in any machine-readable form.
