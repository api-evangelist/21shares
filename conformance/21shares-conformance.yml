note: >-
  21Shares publishes no API, so the cross-cutting web-API standards below are all false by absence.
  What it DOES publish machine-readably is its regulatory distribution data: the FinDatEx European
  template family (EMT / EPT / EET), which is the domain standard for this market. Those files were
  fetched, opened and their field dictionaries read to confirm the version and shape — they are not a
  prose claim on a marketing page.
