aid: 21shares
name: 21Shares
description: >-
  21Shares AG is a Swiss-headquartered issuer of physically backed cryptocurrency exchange-traded
  products (ETPs), founded in 2018 as Amun AG and part of the 21.co group. It runs the largest suite
  of crypto ETPs in the world — single-asset, staking, and index/basket products covering Bitcoin,
  Ethereum, Solana, XRP and dozens of other assets — listed on regulated European exchanges including
  SIX Swiss Exchange, Xetra and Euronext, and distributed through banks and brokers. The product is a
  regulated financial instrument, not software: 21Shares publishes no developer program, no public API
  reference and no SDKs. What it does publish machine-readably is regulatory distribution data — the
  FinDatEx European MiFID Template (EMT V4.2), European PRIIPs Template (EPT) and European ESG Template
  (EET V1.1.3) spreadsheets covering its full ETP range with ISINs, costs and target-market data — plus
  PRIIPs KIDs, prospectuses, final terms and factsheets as PDFs, and an RSS research feed.
